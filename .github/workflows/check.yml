name: Check ROM-free badge port

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host/test dependencies
        run: python -m pip install -r tools/nes/requirements-test.txt -r tools/nes/requirements-assets.txt
      - name: Audit exact tracked publication content
        run: python tools/publication_audit.py
      - name: Check generated packages and original artwork
        run: |
          python tools/nes/package_apps.py --check
          python tools/nes/generate_library_assets.py --check
      - name: Build and test without commercial ROMs
        run: |
          python tools/nes/build.py --host
          python -m unittest discover -s tools/nes -p 'test_*.py' -v

  native-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tools/nes/requirements-test.txt
      - name: Fetch and verify the pinned ARM toolchain
        run: |
          mkdir -p .toolchain
          curl --fail --location --retry 3 https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v15.2.1-1.1/xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz -o .toolchain/arm.tar.gz
          echo 'da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6  .toolchain/arm.tar.gz' | sha256sum --check
          tar -xzf .toolchain/arm.tar.gz -C .toolchain
          echo "$GITHUB_WORKSPACE/.toolchain/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned MicroPython tools and headers (no ROM/firmware download)
        run: |
          git init .toolchain/micropython
          git -C .toolchain/micropython remote add origin https://github.com/micropython/micropython.git
          git -C .toolchain/micropython fetch --depth 1 origin 29d45e488c0c194014db7dc63dd974d11f393ef2
          git -C .toolchain/micropython checkout --detach FETCH_HEAD
      - name: Compile host and native cores
        run: |
          python tools/nes/build.py --host
          python tools/nes/build.py --micropython .toolchain/micropython
      - name: Check prebuilt reproducibility and execute actual ARM code
        run: |
          cmp tools/nes/build-armv7m/_nes_core.mpy badge/apps/zelda/_nes_core.mpy
          python tools/nes/smoke_arm.py --module tools/nes/build-armv7m/_nes_core.mpy
